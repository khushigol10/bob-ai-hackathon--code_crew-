submission:
  title: "L2 Supply Chain Disruption Assistant & Fleet Utilisation Optimizer"

  problem_statement: >
    Global supply chains are routinely disrupted by port strikes, severe weather,
    and transport delays, leaving operations teams without real-time visibility
    into which cold-chain shipments are at risk and which fleet assets should be
    reallocated. Manual analysis is too slow when cargo spoilage windows are
    measured in hours.

  solution_summary: >
    We built a real-time Supply Chain Control Tower that monitors active disruptions,
    cold-chain cargo risk, and fleet utilisation. An embedded AI assistant — powered
    by IBM watsonx.ai (Granite 3 8B Instruct) — answers natural-language questions
    about shipment risk, disruption impact simulations, and optimal fleet allocation,
    grounding every answer in deterministic backend data so no facts are invented.

  key_features:
    - "Real-time disruption monitoring dashboard with live backend data (port strikes, severe weather)"
    - "Cold-chain risk assessment: temperature range validation and spoilage alert for vaccine/perishable cargo"
    - "48-hour what-if disruption simulation: projects cargo value at risk and cold-chain exposure"
    - "Fleet utilisation optimiser: matches available refrigerated/standard assets to shipment requirements"
    - "IBM watsonx.ai conversational assistant (Granite 3 8B Instruct) with multi-turn context and structured fact grounding"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React 19", "Vite"]
    ibm_technologies: ["watsonx.ai", "ibm/granite-3-8b-instruct"]
    databases: []
    other: ["uvicorn", "pydantic", "CORS middleware"]

  what_we_are_most_proud_of: >
    The AI assistant's grounding architecture: every answer is built from
    deterministic structured facts gathered by the backend before the AI model
    is called. The model cannot invent shipment IDs, cargo values, or risk scores —
    it can only explain and elaborate on verified data. This makes the assistant
    reliable enough for operational decision-making even in a demo/hackathon context.
    The FallbackProvider also ensures the full application works and gives real
    structured answers even without watsonx credentials.

  known_limitations: >
    All shipment, disruption, and fleet data is hardcoded demo data — not connected
    to a live database or real logistics APIs. Cold-chain temperature readings are
    simulated (static sensor value). The what-if simulation only supports extending
    a single disruption by a fixed 48-hour window via the UI button. Authentication
    and authorisation are not implemented.

