# =============================================================================
# HACKATHON SUBMISSION METADATA
# =============================================================================
# Instructions:
#   - Fill in ALL required fields (marked with # REQUIRED)
#   - Optional fields can be left as empty strings ""
#   - Do NOT rename this file — the evaluation pipeline reads it by name
#   - Use double quotes around all string values
# =============================================================================

team:
  name: "Code Crew"                      # REQUIRED — e.g., "Orion Squad"
  track: "AI"                            # REQUIRED — one of: AI | DevOps | Sustainability | Open
  lead:
    name: "FILL_IN_TEAM_LEAD_NAME"       # REQUIRED — e.g., "Alice Chen"
    email: "FILL_IN_TEAM_LEAD_EMAIL"     # REQUIRED — e.g., "alice.chen@ibm.com"
  members:
    - name: "FILL_IN_MEMBER_1_NAME"      # REQUIRED — Team member 1
      email: "FILL_IN_MEMBER_1_EMAIL"
    - name: "FILL_IN_MEMBER_2_NAME"      # Add more members by copying the two lines above
      email: "FILL_IN_MEMBER_2_EMAIL"
    - name: "FILL_IN_MEMBER_3_NAME"
      email: "FILL_IN_MEMBER_3_EMAIL"

submission:
  title: "Supply Chain Control Tower"    # REQUIRED — Project display name

  problem_statement: >                   # REQUIRED — 1-3 sentences. What problem? Who has it?
    Supply chain operations managers lose 30-60 minutes per incident manually
    cross-referencing disruption alerts, cold-chain shipment status, and fleet
    availability across disconnected systems — at the exact moment fast decisions
    prevent cargo spoilage and SLA breaches.

  solution_summary: >                    # REQUIRED — 1-3 sentences. What did you build?
    A real-time Supply Chain Control Tower with a FastAPI backend that deterministically
    computes disruption impact, cold-chain risk, and fleet recommendations, paired with
    an IBM watsonx.ai (Granite) assistant that answers natural-language questions grounded
    entirely in backend-computed facts — no hallucinated values, with full fallback mode
    when credentials are absent.

  key_features:                          # REQUIRED — List 3 to 5 specific features
    - "Real-time disruption monitoring dashboard with severity, location, and expected duration"
    - "Shipment risk ranking (Critical/High/Medium) with cold-chain and cargo value visibility"
    - "What-If simulation: projects risk escalation, impacted shipments, and cargo value at risk if a disruption extends"
    - "Fleet optimisation: recommends the best available refrigerated or standard asset by proximity and utilisation"
    - "Bob AI Assistant powered by ibm/granite-3-8b-instruct via watsonx.ai — grounded in deterministic backend facts with graceful fallback mode"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React", "Vite"]
    ibm_technologies: ["watsonx.ai (ibm/granite-3-8b-instruct)", "IBM Bob"]
    databases: []
    other: ["Uvicorn", "Pydantic v2", "python-dotenv", "oxlint"]

  what_we_are_most_proud_of: >           # Optional but recommended
    The grounded AI assistant architecture: the backend computes all facts deterministically
    first, then passes them as structured JSON context to IBM Granite. The model can only
    cite values the backend calculated — shipment IDs, cargo values, risk scores, and fleet
    recommendations are all verified before the AI ever sees them. The fallback provider
    ensures the entire application — including the assistant — works end-to-end with zero
    external dependencies, making the demo resilient regardless of credential availability.

  known_limitations: >                   # Optional but recommended
    Shipment, fleet, and disruption data is hardcoded in-memory (no database) for hackathon
    scope. The cold-chain temperature endpoint uses a fixed demo sensor reading rather than
    a live IoT feed. The What-If simulation panel is fixed to the Rotterdam port strike;
    arbitrary disruption simulations are available through the AI assistant. No API
    authentication is implemented. The ibm-watsonx-ai SDK must be installed separately
    when live AI responses are required.

